# .github/workflows/publish.yml

name: Publish

on:
  push:
    branches: ["publish-test"]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish package
        run: npm publish
